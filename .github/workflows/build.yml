name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build all variants
        run: |
          cd "com.maksimowiczm.findmyip_15_src.tar.gz"
          # Initialize Gradle wrapper if missing
          gradle wrapper
          chmod +x gradlew
          ./gradlew assemble
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Sign Release APKs
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: com.maksimowiczm.findmyip_15_src.tar.gz/app/build/outputs/apk
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

      - name: Prepare and Rename Artifacts
        run: |
          mkdir -p artifacts
          PROJECT_ROOT="com.maksimowiczm.findmyip_15_src.tar.gz"
          
          # Extract version info safely
          VERSION_NAME=$(grep "versionName =" $PROJECT_ROOT/app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep "versionCode =" $PROJECT_ROOT/app/build.gradle.kts | head -n 1 | sed 's/.*= //')
          PACKAGE_ID="com.maksimowiczm.findmyip"
          
          echo "Base Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          
          # Find all APKs and rename them
          find "$PROJECT_ROOT/app/build/outputs/apk" -name "*.apk" | while read apk; do
            filename=$(basename "$apk")
            dir=$(dirname "$apk")
            
            # Extract build type (e.g., debug, release)
            build_type=$(basename "$dir")
            # Extract flavor (e.g., openSourceIpify, openSourceFake)
            flavor_dir=$(dirname "$dir")
            flavor=$(basename "$flavor_dir")
            
            # Only process relevant flavors
            if [[ "$flavor" == "openSourceIpify" || "$flavor" == "openSourceFake" ]]; then
              
              current_pkg="$PACKAGE_ID"
              current_ver="$VERSION_NAME"
              
              if [[ "$flavor" == "openSourceFake" ]]; then
                current_pkg="${PACKAGE_ID}.fake"
                current_ver="${VERSION_NAME}-fake"
              fi
              
              # Construct descriptive variant label
              variant_label="${flavor}-${build_type}"
              
              # Priority: Signed > Unsigned > Others (like debug)
              if [[ "$filename" == *"-signed.apk" ]]; then
                new_name="${current_pkg}-${current_ver}-${VERSION_CODE}-${variant_label}-signed.apk"
                cp "$apk" "artifacts/$new_name"
              elif [[ "$filename" == *"-unsigned.apk" ]]; then
                new_name="${current_pkg}-${current_ver}-${VERSION_CODE}-${variant_label}-unsigned.apk"
                cp "$apk" "artifacts/$new_name"
              else
                # Default case (e.g., debug APKs)
                new_name="${current_pkg}-${current_ver}-${VERSION_CODE}-${variant_label}.apk"
                cp "$apk" "artifacts/$new_name"
              fi
              echo "Processed $filename -> $new_name"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: find-my-ip-apks
          path: artifacts/*.apk
