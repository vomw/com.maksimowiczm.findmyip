name: Extract Archives and Commit

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Extract to temp and restore
        run: |
          set -e

          TMP_DIR="$(mktemp -d)"
          changed=false

          echo "Using temp dir: $TMP_DIR"

          # --- Extract .tar.gz ---
          find . -name "*.tar.gz" -print0 | while IFS= read -r -d '' path; do
            if [ -f "$path" ]; then
              echo "Processing $path"

              if file "$path" | grep -q 'gzip compressed'; then
                DEST="$TMP_DIR/$(dirname "$path")"
                mkdir -p "$DEST"

                if tar -xzf "$path" -C "$DEST"; then
                  rm -f "$path"
                  changed=true
                else
                  echo "Failed to extract $path"
                  exit 1
                fi
              else
                echo "Skipping (not real gzip): $path"
              fi
            else
              echo "Skipping (not a file): $path"
            fi
          done

          # --- Extract .gz (non-tar) ---
          find . -name "*.gz" ! -name "*.tar.gz" -print0 | while IFS= read -r -d '' path; do
            if [ -f "$path" ]; then
              echo "Processing $path"

              if file "$path" | grep -q 'gzip compressed'; then
                DEST="$TMP_DIR/$(dirname "$path")"
                mkdir -p "$DEST"

                OUT="$DEST/$(basename "${path%.gz}")"

                if gunzip -c "$path" > "$OUT"; then
                  rm -f "$path"
                  changed=true
                else
                  echo "Failed to extract $path"
                  exit 1
                fi
              else
                echo "Skipping (not real gzip): $path"
              fi
            fi
          done

          # --- Move extracted files back ---
          echo "Restoring extracted files..."
          rsync -a "$TMP_DIR"/ ./

          echo "changed=$changed" >> $GITHUB_ENV

      - name: Commit and push changes
        if: env.changed == 'true'
        run: |
          git add .
          git commit -m "Extract archives via temp dir and remove compressed files"
          git push